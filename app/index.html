<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker ECR CI/CD</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            margin-top: 10px;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #14532d;
            border-radius: 20px;
            color: #86efac;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Docker + Amazon ECR</h1>
        <h2>Hello from Nginx!</h2>

        <p>Automated CI/CD using GitHub Actions.</p>
        <p>Containerized application running successfully.</p>

        <div class="status">Application Online</div>
    </div>
</body>
</html>
